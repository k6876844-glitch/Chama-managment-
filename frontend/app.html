<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Umoja Chama</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app logged-out">
  <aside class="sidebar">
    <a href="index.html" class="brand"><img src="icon.svg" alt="" width="28" height="28"> <span>Umoja Chama</span></a>
    <nav class="tabs" id="tabs"></nav>
    <div class="user-box">
      <div><b id="userName"></b><span id="userRole" class="muted small"></span></div>
      <button type="button" class="btn btn-ghost btn-small" id="logoutBtn">Log out</button>
    </div>
  </aside>

  <main id="view" class="view"></main>

  <dialog id="modal">
    <form id="modalForm">
      <h3 id="modalTitle"></h3>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="modalCancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
