<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Umoja Chama</title>
  <meta name="theme-color" content="#0b1b34">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme and sidebar state before first paint, so the page does not flash.
    try {
      const t = localStorage.getItem('chama_theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      if (localStorage.getItem('chama_sidebar') === 'collapsed') document.documentElement.classList.add('sidebar-collapsed');
    } catch {}
  </script>
</head>
<body class="logged-out">
  <div id="progress" class="progress" aria-hidden="true"></div>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="sidebar-head">
        <a href="#dashboard" class="brand">
          <img src="icon.svg" alt="" width="34" height="34">
          <span class="brand-text"><b>Umoja Chama</b><small>Savings &amp; loans</small></span>
        </a>
        <button type="button" class="icon-btn sidebar-close" id="sidebarClose" aria-label="Close menu"></button>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <button type="button" class="nav-link" id="logoutBtn"><span class="nav-icon" data-icon="logout"></span><span class="nav-label">Log out</span></button>
        <button type="button" class="nav-link collapse-btn" id="collapseBtn" aria-label="Collapse sidebar"><span class="nav-icon" data-icon="chevronsLeft"></span><span class="nav-label">Collapse</span></button>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="main">
      <header class="topbar">
        <button type="button" class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"></button>
        <div class="search" id="search" role="search">
          <span class="search-icon" data-icon="search"></span>
          <input id="searchInput" type="search" placeholder="Search members, loans, payments…" autocomplete="off" aria-label="Search" aria-controls="searchResults">
          <kbd class="search-kbd">/</kbd>
          <div class="search-results popover" id="searchResults" hidden></div>
        </div>
        <div class="topbar-right">
          <span class="today" id="todayLabel"></span>
          <div class="menu-anchor">
            <button type="button" class="icon-btn" id="bellBtn" aria-label="Notifications" aria-haspopup="true" aria-expanded="false">
              <span data-icon="bell"></span><span class="badge-dot" id="bellCount" hidden></span>
            </button>
            <div class="popover notif-pop" id="notifPop" hidden></div>
          </div>
          <div class="menu-anchor">
            <button type="button" class="profile-btn" id="profileBtn" aria-haspopup="true" aria-expanded="false">
              <span class="avatar" id="profileAvatar"></span>
              <span class="profile-text"><b id="userName"></b><small id="userRole"></small></span>
              <span class="chev" data-icon="chevronDown"></span>
            </button>
            <div class="popover profile-pop" id="profilePop" hidden>
              <a href="#settings" class="pop-item"><span data-icon="user"></span>My profile &amp; settings</a>
              <a href="#reports" class="pop-item"><span data-icon="fileText"></span>My statement</a>
              <button type="button" class="pop-item danger" id="logoutBtn2"><span data-icon="logout"></span>Log out</button>
            </div>
          </div>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="auth" class="auth-root"></div>

  <dialog id="modal" class="modal" aria-labelledby="modalTitle">
    <form id="modalForm" novalidate>
      <header class="modal-head">
        <div>
          <h2 id="modalTitle"></h2>
          <p id="modalSub" class="muted small"></p>
        </div>
        <button type="button" class="icon-btn" id="modalX" aria-label="Close" data-icon="x"></button>
      </header>
      <div class="modal-error" id="modalError" role="alert" hidden></div>
      <div id="modalBody" class="modal-body"></div>
      <footer class="modal-actions" id="modalActions">
        <button type="button" class="btn btn-ghost" id="modalCancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="modalSubmit">Save</button>
      </footer>
    </form>
  </dialog>

  <dialog id="confirm" class="modal modal-sm" aria-labelledby="confirmTitle">
    <form method="dialog" class="confirm-body">
      <span class="confirm-icon" id="confirmIcon"></span>
      <h2 id="confirmTitle"></h2>
      <p id="confirmText" class="muted"></p>
      <div class="modal-actions">
        <button value="cancel" class="btn btn-ghost">Cancel</button>
        <button value="ok" class="btn btn-danger" id="confirmOk">Confirm</button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/core.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/members.js"></script>
  <script src="js/views/contributions.js"></script>
  <script src="js/views/loans.js"></script>
  <script src="js/views/repayments.js"></script>
  <script src="js/views/expenses.js"></script>
  <script src="js/views/fines.js"></script>
  <script src="js/views/meetings.js"></script>
  <script src="js/views/reports.js"></script>
  <script src="js/views/notifications.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
